<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WindowsAxon Hub</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --surface: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #0969da;
      --ok: #1a7f37;
      --err-bg: #ffebe9;
      --err-text: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --ok: #3fb950;
        --err-bg: #3b1219;
        --err-text: #ff7b72;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 920px;
      margin: 32px auto;
      padding: 0 20px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ok) 15%, transparent);
      color: var(--ok);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    button {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .error {
      display: none;
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 6px;
      background: var(--err-bg);
      color: var(--err-text);
      font-size: 0.9rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }
    th {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: color-mix(in srgb, var(--bg) 60%, var(--surface));
    }
    tbody tr:last-child td { border-bottom: none; }
    .node-name {
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      flex-shrink: 0;
    }
    .muted { color: var(--muted); }
    .empty {
      padding: 36px 16px;
      text-align: center;
      color: var(--muted);
    }
    footer {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>
        WindowsAxon Hub
        <span id="count-badge" class="badge">0 online</span>
      </h1>
      <div class="controls">
        <label>
          <input id="auto-refresh" type="checkbox" checked />
          Auto-refresh (5s)
        </label>
        <button id="refresh-btn" type="button">Refresh</button>
      </div>
    </header>

    <div id="error-banner" class="error" role="alert"></div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Node Name</th>
            <th>Online Since</th>
            <th>OS</th>
          </tr>
        </thead>
        <tbody id="nodes-body">
          <tr><td colspan="3" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <footer>
      <span id="last-updated">Last updated: —</span>
      <span>Endpoint: /api/nodes</span>
    </footer>
  </main>

  <script>
    const nodesBody = document.getElementById("nodes-body");
    const countBadge = document.getElementById("count-badge");
    const lastUpdated = document.getElementById("last-updated");
    const errorBanner = document.getElementById("error-banner");
    const refreshBtn = document.getElementById("refresh-btn");
    const autoRefresh = document.getElementById("auto-refresh");

    let timerId = null;

    function formatUtc(iso) {
      if (!iso) return { text: "—", title: "" };
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return { text: iso, title: iso };
      return { text: date.toLocaleString(), title: date.toISOString() };
    }

    function renderNodes(nodes) {
      countBadge.textContent = `${nodes.length} online`;
      nodesBody.textContent = "";

      if (nodes.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 3;
        td.className = "empty";
        td.textContent = "No nodes currently online.";
        tr.appendChild(td);
        nodesBody.appendChild(tr);
        return;
      }

      for (const node of nodes) {
        const tr = document.createElement("tr");

        const nameTd = document.createElement("td");
        const nameWrap = document.createElement("span");
        nameWrap.className = "node-name";
        const dot = document.createElement("span");
        dot.className = "dot";
        nameWrap.appendChild(dot);
        nameWrap.appendChild(document.createTextNode(node.name ?? ""));
        nameTd.appendChild(nameWrap);

        const sinceTd = document.createElement("td");
        const formatted = formatUtc(node.onlineSinceUtc);
        sinceTd.textContent = formatted.text;
        if (formatted.title) sinceTd.title = formatted.title;

        const osTd = document.createElement("td");
        if (node.osDescription) {
          osTd.textContent = node.osDescription;
        } else {
          osTd.textContent = "—";
          osTd.className = "muted";
        }

        tr.appendChild(nameTd);
        tr.appendChild(sinceTd);
        tr.appendChild(osTd);
        nodesBody.appendChild(tr);
      }
    }

    async function loadNodes() {
      try {
        const res = await fetch("/api/nodes", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        errorBanner.style.display = "none";
        renderNodes(Array.isArray(data.nodes) ? data.nodes : []);
        lastUpdated.textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        errorBanner.textContent = `Failed to load nodes: ${err.message}`;
        errorBanner.style.display = "block";
      }
    }

    function updateTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
      if (autoRefresh.checked) {
        timerId = setInterval(loadNodes, 5000);
      }
    }

    refreshBtn.addEventListener("click", loadNodes);
    autoRefresh.addEventListener("change", updateTimer);

    loadNodes();
    updateTimer();
  </script>
</body>
</html>
