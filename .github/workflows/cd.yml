name: CD

# Manual only: releases are started by the repo owner from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_NUMBER: ${{ github.run_number }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  release:
    name: Publish and release
    # Only the repo owner may release, and only from main.
    if: github.triggering_actor == 'wooly905' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Require a successful CI run for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $passed = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $env:RELEASE_SHA --status success --json databaseId --jq length
          if ([int]$passed -eq 0) {
            Write-Error "CI has not passed for $env:RELEASE_SHA. Wait for CI to succeed, then start CD again."
            exit 1
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Resolve version
        shell: pwsh
        run: |
          $version = dotnet msbuild src/WindowsAxon.Agent/WindowsAxon.Agent.csproj -getProperty:Version -p:BuildNumber=$env:BUILD_NUMBER
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version: $version"

      - name: Publish single-file app
        run: >-
          dotnet publish src/WindowsAxon.App/WindowsAxon.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableMsixTooling=true
          -p:DebugType=none
          -p:BuildNumber=${{ env.BUILD_NUMBER }}
          -o publish

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/WindowsAxon-$env:VERSION-win-x64.exe"
          Copy-Item publish/WindowsAxon.App.exe $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $exe -Leaf)" | Set-Content "$exe.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: WindowsAxon-${{ env.VERSION }}-win-x64
          path: dist/*

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" dist/* `
            --target $env:RELEASE_SHA `
            --title "WindowsAxon $env:VERSION" `
            --generate-notes
