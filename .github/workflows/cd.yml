name: CD

# Manual only: releases are started by the repo owner from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_NUMBER: ${{ github.run_number }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  release:
    name: Publish and release
    # Only the repo owner may release, and only from main.
    if: github.triggering_actor == 'wooly905' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Require a successful CI run for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $passed = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $env:RELEASE_SHA --status success --json databaseId --jq length
          if ([int]$passed -eq 0) {
            Write-Error "CI has not passed for $env:RELEASE_SHA. Wait for CI to succeed, then start CD again."
            exit 1
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Resolve version
        shell: pwsh
        run: |
          $version = dotnet msbuild src/WindowsAxon.Agent/WindowsAxon.Agent.csproj -getProperty:Version -p:BuildNumber=$env:BUILD_NUMBER
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version: $version"

      - name: Publish single-file app
        run: >-
          dotnet publish src/WindowsAxon.App/WindowsAxon.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableMsixTooling=true
          -p:DebugType=none
          -p:BuildNumber=${{ env.BUILD_NUMBER }}
          -o publish

      - name: Publish single-file hub
        run: >-
          dotnet publish src/WindowsAxon.Hub/WindowsAxon.Hub.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:BuildNumber=${{ env.BUILD_NUMBER }}
          -o publish-hub

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $assets = @(
            @{ Source = "publish/WindowsAxon.App.exe"; Target = "dist/WindowsAxon.App.win-x64.exe" }
            @{ Source = "publish-hub/WindowsAxon.Hub.exe"; Target = "dist/WindowsAxon.Hub.win-x64.exe" }
          )
          foreach ($asset in $assets) {
            Copy-Item $asset.Source $asset.Target
            $hash = (Get-FileHash $asset.Target -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $asset.Target -Leaf)" | Set-Content "$($asset.Target).sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v7
        with:
          name: WindowsAxon-${{ env.VERSION }}-win-x64
          path: dist/*

      # --generate-notes lists merged PRs only, so build the notes from every
      # commit since the last release: PR commits show the PR, direct pushes show the commit.
      - name: Build release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $prev = gh api "repos/$repo/releases/latest" --jq .tag_name 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $prev) {
            "Initial release." | Set-Content $notes -Encoding utf8
            "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV
            exit 0
          }

          $commits = gh api --paginate "repos/$repo/compare/$prev...$env:RELEASE_SHA" `
            --jq '.commits[] | {sha, login: .author.login, name: .commit.author.name, subject: (.commit.message | split("\n")[0])}' |
            ForEach-Object { $_ | ConvertFrom-Json }

          $seen = @{}
          $lines = foreach ($c in $commits) {
            $pr = gh api "repos/$repo/commits/$($c.sha)/pulls" `
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty | {number, title, login: .user.login}' |
              ConvertFrom-Json
            if ($pr) {
              if ($seen.ContainsKey($pr.number)) { continue }
              $seen[$pr.number] = $true
              "* $($pr.title) by @$($pr.login) in #$($pr.number)"
            } else {
              $author = if ($c.login) { "@$($c.login)" } else { $c.name }
              "* $($c.subject) by $author in $($c.sha.Substring(0, 7))"
            }
          }
          if (-not $lines) { $lines = '* No changes' }

          @("## What's Changed") + $lines + '' +
            "**Full Changelog**: https://github.com/$repo/compare/$prev...v$env:VERSION" -join "`n" |
            Set-Content $notes -Encoding utf8
          "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" dist/* `
            --target $env:RELEASE_SHA `
            --title "WindowsAxon $env:VERSION" `
            --notes-file $env:RELEASE_NOTES
