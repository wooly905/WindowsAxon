name: CD

# Manual only: releases are started by the repo owner from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_NUMBER: ${{ github.run_number }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  release:
    name: Publish and release
    # Only the repo owner may release, and only from main.
    if: github.triggering_actor == 'wooly905' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      # Step-level `if` cannot read secrets; signing is skipped until SignPath is configured.
      SIGNPATH_TOKEN_PRESENT: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - name: Require a successful CI run for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $passed = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $env:RELEASE_SHA --status success --json databaseId --jq length
          if ([int]$passed -eq 0) {
            Write-Error "CI has not passed for $env:RELEASE_SHA. Wait for CI to succeed, then start CD again."
            exit 1
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Resolve version
        shell: pwsh
        run: |
          $version = dotnet msbuild src/WindowsAxon.Agent/WindowsAxon.Agent.csproj -getProperty:Version -p:BuildNumber=$env:BUILD_NUMBER
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version: $version"

      - name: Publish single-file app
        run: >-
          dotnet publish src/WindowsAxon.App/WindowsAxon.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableMsixTooling=true
          -p:DebugType=none
          -p:BuildNumber=${{ env.BUILD_NUMBER }}
          -o publish

      - name: Upload unsigned app
        id: upload_unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-archive
          path: publish/WindowsAxon.App.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath
        if: env.SIGNPATH_TOKEN_PRESENT == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: WindowsAxon
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $source = if ($env:SIGNPATH_TOKEN_PRESENT -eq 'true') { 'signed/WindowsAxon.App.exe' } else { 'publish/WindowsAxon.App.exe' }
          if (-not (Test-Path $source)) {
            Write-Error "Release binary not found: $source"
            exit 1
          }
          Write-Host "Release binary: $source"
          $exe = "dist/WindowsAxon-$env:VERSION-win-x64.exe"
          Copy-Item $source $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $exe -Leaf)" | Set-Content "$exe.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: WindowsAxon-${{ env.VERSION }}-win-x64
          path: dist/*

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" dist/* `
            --target $env:RELEASE_SHA `
            --title "WindowsAxon $env:VERSION" `
            --generate-notes
